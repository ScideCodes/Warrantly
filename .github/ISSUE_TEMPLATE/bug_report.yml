name: Bug report
description: Something in Warrantly does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Say what you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings, Help and feedback, at the bottom.
  - type: input
    id: device
    attributes:
      label: Phone and Android version
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or text size
      description: Do not include real receipts, email addresses or other personal data.
