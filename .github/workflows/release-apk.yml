# Release APK: builds the installable APK on GitHub instead of EAS (no build quota), signed with the release key
# for dev.warrantly.app from the repository secrets. Over-the-air updates stay on (channel "preview", runtime =
# app version). Gmail import is on for everyone.
# The APK is uploaded as a workflow artifact. Pushing a v* tag also publishes the GitHub release with the APK;
# its text comes from docs/release-notes/<tag>.md.
name: Release APK
on:
  push:
    branches: ['**'] # with tags set, branch pushes need this to still run on workflow edits
    paths: ['.github/workflows/release-apk.yml'] # not checked for tag pushes
    tags: ['v*']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # publish the release on a tag
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: gradle/actions/setup-gradle@v4
      - name: Checks
        run: |
          npm ci
          npm test
          # Expo writes this git-ignored file on `expo start`; the style types for Reanimated transitions come from it.
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npm run typecheck
      - name: Build and sign
        # arm64-v8a and armeabi-v7a for phones; x86_64 so the same APK can be tested on an emulator.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          rm "$RUNNER_TEMP/release.jks"
          version=$(node -p "require('../app.json').expo.version")
          cp app/build/outputs/apk/release/app-release.apk "../Warrantly-$version.apk"
          # keytool cannot read APK signature scheme v2; apksigner can.
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "../Warrantly-$version.apk" | grep -i "SHA-1"
      - uses: actions/upload-artifact@v4
        with:
          name: warrantly-apk
          path: Warrantly-*.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" "Warrantly-$version.apk" --title "Warrantly $version" --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
