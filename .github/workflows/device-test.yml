# On-device test: builds the app for x86_64 from this commit, runs it on Google's Android emulator and
# drives it with Maestro. Runs when .maestro/ or this file changes, or by hand. Screenshots are uploaded.
name: Device test
on:
  push:
    paths: ['.maestro/**', '.github/workflows/device-test.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The app build and the emulator together outgrow the runner's free disk; drop unused toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules/@angular
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app (x86_64, from this commit)
        # Built here, not on EAS: no build quota, and it always tests the pushed code. Over-the-air updates
        # are switched off in this build so it only ever runs its own bundle.
        run: |
          npm ci
          python3 -c "import json; p='app.json'; d=json.load(open(p)); d['expo'].pop('updates', None); json.dump(d, open(p, 'w'), indent=2)"
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../app.apk
          ./gradlew --stop
          cd .. && rm -rf android node_modules/.cache && df -h /
      - name: Test files and Maestro
        run: |
          pip install --quiet pillow
          python3 .maestro/fixtures.py
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .maestro/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test
          path: out/
