# On-device test: the x86_64 test build (EAS profile "emulator") on Google's Android emulator, driven by
# Maestro. Runs when .maestro/ changes; .maestro/apk-url.txt names the build. Screenshots are uploaded.
name: Device test
on:
  push:
    paths: ['.maestro/**', '.github/workflows/device-test.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: App, test files and Maestro
        run: |
          curl -fsSL -o app.apk "$(cat .maestro/apk-url.txt)"
          pip install --quiet pillow
          python3 .maestro/fixtures.py
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .maestro/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test
          path: out/
