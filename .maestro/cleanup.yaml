# #12: delete all my data; the app starts like a new install.
appId: dev.warrantly.app
---
- extendedWaitUntil: { visible: "Search warranties", timeout: 60000 }
- tapOn: "Settings"
- scrollUntilVisible: { element: "Delete all my data" }
- waitForAnimationToEnd
- tapOn: "Delete all my data"
- tapOn: "Delete from this phone"
- extendedWaitUntil: { visible: "Welcome to Warrantly", timeout: 90000 }
- takeScreenshot: 26-after-delete
