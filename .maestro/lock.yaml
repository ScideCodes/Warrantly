# The PIN must not be asked again when settings change (user report).
appId: dev.warrantly.app
---
- launchApp:
    clearState: true
- extendedWaitUntil: { visible: "Your name", timeout: 90000 }
- tapOn: "Your name"
- inputText: "Tester"
- hideKeyboard
- tapOn: "Continue"
- tapOn: "Set up PIN"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "Continue"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- extendedWaitUntil: { visible: "Search warranties", timeout: 30000 }
- tapOn: "Settings"
- extendedWaitUntil: { visible: "Settings", timeout: 20000 }
- scrollUntilVisible: { element: "Magyar" }
- takeScreenshot: L1-settings
- tapOn: "Magyar"
- takeScreenshot: L2-after-language
- assertNotVisible: "Add meg a PIN-kódot|Enter your PIN"
- tapOn: "Telefon"
- scrollUntilVisible: { element: "60 days before", direction: UP, timeout: 6000, optional: true }
- scrollUntilVisible: { element: "60 days before" }
- waitForAnimationToEnd
- tapOn: "60 days before"
- takeScreenshot: L3-after-reminder-day
- assertNotVisible: "Enter your PIN"
- scrollUntilVisible: { element: "Expiry reminders", direction: UP, timeout: 6000, optional: true }
- scrollUntilVisible: { element: "Expiry reminders" }
- waitForAnimationToEnd
- tapOn: { text: "Expiry reminders", index: 0 }
- takeScreenshot: L4-after-reminders-toggle
- assertNotVisible: "Enter your PIN"
- scrollUntilVisible: { element: "Names on the widget", direction: UP, timeout: 6000, optional: true }
- scrollUntilVisible: { element: "Names on the widget" }
- tapOn: "Names on the widget"
- takeScreenshot: L5-after-widget-toggle
- assertNotVisible: "Enter your PIN"
- back
- takeScreenshot: L6-home
- assertNotVisible: "Enter your PIN"
- tapOn: "Settings"
- scrollUntilVisible: { element: "Dark", direction: UP, timeout: 6000, optional: true }
- scrollUntilVisible: { element: "Dark" }
- waitForAnimationToEnd
- tapOn: "Dark"
- extendedWaitUntil: { visible: "Search warranties|Enter your PIN", timeout: 90000 }
- takeScreenshot: L7-after-theme-restart
- assertNotVisible: "Enter your PIN"
