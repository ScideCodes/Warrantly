appId: dev.warrantly.prototype
---
# Onboarding: name, then "Later" for the PIN. A new install must not show "What's new".
- launchApp:
    clearState: true
- extendedWaitUntil: { visible: "Welcome to Warrantly", timeout: 90000 }
- tapOn: "Your name"
- inputText: "Tester"
- hideKeyboard
- tapOn: "Continue"
- tapOn: "Later"
- extendedWaitUntil: { visible: "Hi, Tester!|Got it", timeout: 30000 }
- runFlow:
    when: { visible: "Got it" }
    commands:
      - takeScreenshot: BUG-whats-new-on-new-install
      - tapOn: "Got it"
- extendedWaitUntil: { visible: "Hi, Tester!", timeout: 30000 }
- takeScreenshot: 01-home-empty

# #4 #6 price and category on a new warranty
- tapOn: "\\+ Add"
- extendedWaitUntil: { visible: "Add warranty", timeout: 20000 }
- tapOn: { id: "product_name" }
- inputText: "Philips HD9350"
- tapOn: { id: "store_name" }
- inputText: "MediaMarkt"
- hideKeyboard
- scrollUntilVisible: { element: "Appliances" }
- waitForAnimationToEnd
- tapOn: "Appliances"
- scrollUntilVisible: { element: "Price" }
- waitForAnimationToEnd
- tapOn: { id: "price" }
- inputText: "19990"
- hideKeyboard
- takeScreenshot: 02-form
- scrollUntilVisible: { element: "Save warranty" }
- waitForAnimationToEnd
- takeScreenshot: 02b-before-save
- tapOn: "Save warranty"
- takeScreenshot: 02c-after-save
- extendedWaitUntil: { visible: "Philips HD9350", timeout: 20000 }
- assertVisible: "Total value: .*"
- assertVisible: "Appliances"
- takeScreenshot: 03-home-total

# Detail: price, category, #10 brand support, #9 history
- tapOn: "Philips HD9350"
- extendedWaitUntil: { visible: "Price", timeout: 20000 }
- assertVisible: "Appliances"
- scrollUntilVisible: { element: "Find Philips support" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: "e.g. Sent for repair" }
- waitForAnimationToEnd
- tapOn: "e.g. Sent for repair"
- inputText: "Sent for repair"
- hideKeyboard
- tapOn: "Add"
- assertVisible: ".*: Sent for repair"
- takeScreenshot: 04-history

# #7 another warranty for the same purchase
- scrollUntilVisible: { element: "Add another warranty \\(e.g. extended plan\\)" }
- waitForAnimationToEnd
- tapOn: "Add another warranty \\(e.g. extended plan\\)"
- extendedWaitUntil: { visible: "Extended plan", timeout: 20000 }
- tapOn: "Extended plan"
- scrollUntilVisible: { element: "Save warranty" }
- waitForAnimationToEnd
- tapOn: "Save warranty"
- scrollUntilVisible: { element: "Other warranties for this purchase" }
- waitForAnimationToEnd
- assertVisible: ".*Extended plan.*"
- takeScreenshot: 05-covers

# #2 several documents, and the PDF viewer
- scrollUntilVisible: { element: "Attach a photo or PDF" }
- waitForAnimationToEnd
- tapOn: "Attach a photo or PDF"
- runFlow: { file: pick-file.yaml, env: { FILE: fixture-invoice.pdf } }
- extendedWaitUntil: { visible: "Open document", timeout: 30000 }
- scrollUntilVisible: { element: "Attach a photo or PDF" }
- waitForAnimationToEnd
- tapOn: "Attach a photo or PDF"
- runFlow: { file: pick-file.yaml, env: { FILE: fixture-invoice.pdf } }
- extendedWaitUntil: { visible: "Philips HD9350 \\(2\\)\\.pdf", timeout: 30000 }
- assertVisible: "Philips HD9350\\.pdf"
- takeScreenshot: 06-two-documents
- tapOn: "Philips HD9350\\.pdf"
- extendedWaitUntil: { visible: "100%", timeout: 30000 }
- assertVisible: "Open in another app"
- takeScreenshot: 07-viewer
- tapOn: "Zoom in"
- assertVisible: "200%"
- takeScreenshot: 08-viewer-zoom
- back

# #8 product photo from the gallery
- scrollUntilVisible: { element: "\\+ Product photo", direction: UP }
- waitForAnimationToEnd
- tapOn: "\\+ Product photo"
- tapOn: "Choose from gallery"
- extendedWaitUntil: { visible: ".*(Photos|Albums|Photo taken).*", timeout: 30000 }
- takeScreenshot: 09-photo-picker
- tapOn: { text: "Photo taken.*", index: 0 }
- extendedWaitUntil: { visible: ".*(Crop|CROP|Done|DONE).*", timeout: 20000, optional: true }
- takeScreenshot: 10-crop
- tapOn: { text: "Crop|CROP|Done|DONE", optional: true }
- extendedWaitUntil: { notVisible: "\\+ Product photo", timeout: 30000 }
- takeScreenshot: 11-photo

# Test reminder arrives as a notification
- scrollUntilVisible: { element: "Send a test reminder in 5 seconds" }
- waitForAnimationToEnd
- tapOn: "Send a test reminder in 5 seconds"
- extendedWaitUntil: { visible: "never-shown-wait-8s", timeout: 8000, optional: true }
- swipe: { start: "50%, 1%", end: "50%, 80%" }
- extendedWaitUntil: { visible: ".*days left on the warranty", timeout: 15000 }
- takeScreenshot: 12-notification
- back
- back

# Settings: #16 language, #15 reminders, #11 import, #5 #12 export, #17 #13 #19 help/privacy/what's new, #20 rate
- extendedWaitUntil: { visible: "Hi, Tester!", timeout: 20000 }
- assertVisible: ".*Philips HD9350.*"
- tapOn: "Settings"
- extendedWaitUntil: { visible: "Magyar", timeout: 20000 }
- tapOn: "Magyar"
- assertVisible: "Beállítások"
- takeScreenshot: 13-hungarian
- tapOn: "Telefon nyelve"
- assertVisible: "Settings"
- tapOn: "60 days before"
- tapOn: "06:00 PM"
- takeScreenshot: 14-reminders
- scrollUntilVisible: { element: "Import a shared list" }
- waitForAnimationToEnd
- tapOn: "Import a shared list"
- runFlow: { file: pick-file.yaml, env: { FILE: fixture-shared.json } }
- extendedWaitUntil: { visible: "1 warranty added\\.", timeout: 30000 }
- takeScreenshot: 15-imported
- tapOn: "OK"
- tapOn: "Export list as PDF"
- extendedWaitUntil: { visible: ".*(Share|Sharing|Nearby|Bluetooth|Drive|Gmail|Messages|Copy).*", timeout: 30000 }
- takeScreenshot: 16-share-pdf
- back
- tapOn: "Export list as spreadsheet \\(CSV\\)"
- extendedWaitUntil: { visible: ".*(Share|Sharing|Nearby|Bluetooth|Drive|Gmail|Messages|Copy).*", timeout: 30000 }
- takeScreenshot: 17-share-csv
- back
- tapOn: "Export all my data"
- extendedWaitUntil: { visible: ".*(Share|Sharing|Nearby|Bluetooth|Drive|Gmail|Messages|Copy).*", timeout: 30000 }
- back
- scrollUntilVisible: { element: "Help and feedback", direction: UP }
- waitForAnimationToEnd
- tapOn: "Help and feedback"
- tapOn: "Why doesn't a purchase show up\\?"
- assertVisible: "Warrantly only imports.*"
- takeScreenshot: 18-help
- scrollUntilVisible: { element: "Privacy policy" }
- waitForAnimationToEnd
- tapOn: "Privacy policy"
- scrollUntilVisible: { element: ".*Limited Use.*" }
- waitForAnimationToEnd
- takeScreenshot: 19-privacy
- back
- tapOn: "What's new"
- assertVisible: ".*Several documents per warranty.*"
- tapOn: "Got it"
- back
- tapOn: "Rate Warrantly"
- runFlow:
    when: { notVisible: "Rate Warrantly" }
    commands:
      - back
- extendedWaitUntil: { visible: "Rate Warrantly", timeout: 20000 }

# #14 dark mode: the app restarts in the dark palette
- scrollUntilVisible: { element: "Dark", direction: UP }
- waitForAnimationToEnd
- tapOn: "Dark"
- extendedWaitUntil: { visible: "Hi, Tester!", timeout: 90000 }
- assertVisible: ".*Shared Kettle.*"
- takeScreenshot: 20-dark-home
- tapOn: "Philips HD9350"
- extendedWaitUntil: { visible: "Price", timeout: 20000 }
- takeScreenshot: 21-dark-detail
- back
- tapOn: "Settings"
- takeScreenshot: 22-dark-settings
- tapOn: "Light"
- extendedWaitUntil: { visible: "Hi, Tester!", timeout: 90000 }
