# #3: a PDF shared from the Files app opens Warrantly's add form with the file attached.
appId: dev.warrantly.prototype
---
- extendedWaitUntil: { visible: ".*(Recent|Downloads|Files|fixture).*", timeout: 30000 }
- runFlow:
    when: { notVisible: "fixture-share.pdf" }
    commands:
      - tapOn: "Show roots"
      - tapOn: "Downloads"
- longPressOn: "fixture-share.pdf"
- tapOn: "Share"
- extendedWaitUntil: { visible: "Warrantly", timeout: 30000 }
- takeScreenshot: 22b-share-sheet
- tapOn: "Warrantly"
- extendedWaitUntil: { visible: "Add warranty", timeout: 60000 }
- extendedWaitUntil: { visible: "Document attached\\..*", timeout: 60000 }
- takeScreenshot: 23-shared-into-app
- tapOn: { id: "product_name" }
- inputText: "Shared PDF item"
- hideKeyboard
- tapOn: { id: "store_name" }
- inputText: "Shop"
- hideKeyboard
- scrollUntilVisible: { element: "Save warranty" }
- waitForAnimationToEnd
- tapOn: "Save warranty"
- extendedWaitUntil: { notVisible: "Save warranty", timeout: 20000 }
- launchApp
- extendedWaitUntil: { visible: "Hi, Tester!", timeout: 30000 }
- scrollUntilVisible: { element: "Shared PDF item" }
- tapOn: "Shared PDF item"
- scrollUntilVisible: { element: "Open document", timeout: 20000 }
- takeScreenshot: 24-shared-saved
- back
